version: '3.8'

services:
  vocalguard:
    build: .
    container_name: vocalguard
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio_cache:/app/audio_cache
    devices:
      - /dev/ttyACM0:/dev/ttyACM0  # Modem USB
    environment:
      - DATABASE_URL=sqlite:///data/vocalguard.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped

