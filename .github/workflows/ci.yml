name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ElevenLabs, accueil LAN et STT node15
        run: |
          python -m pytest backend/tests/test_elevenlabs_client.py \
            backend/tests/test_greeting_elevenlabs_service.py \
            backend/tests/test_settings_elevenlabs_routes.py \
            backend/tests/test_voice_stt_config.py \
            backend/tests/test_greeting_audiences.py -q --tb=short

      - name: Run backend tests
        run: |
          python -m pytest backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
