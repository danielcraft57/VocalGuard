name: CD Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  cd-pull-based:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment mode information
        run: |
          echo "CD mode: pull-based deployment."
          echo "The production server should run scripts/prod_auto_update.sh from cron."
          echo "Reason: node11.lan is private and not reachable from GitHub-hosted runners."
          echo "Commit pushed to master: $GITHUB_SHA"
