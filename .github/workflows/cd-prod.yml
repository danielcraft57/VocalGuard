name: CD Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  cd-pull-based:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment mode information
        run: |
          echo "CD mode: pull-based deployment."
          echo "The production server should run scripts/prod_auto_update.sh from cron."
          echo "Reason: node14.lan is private and not reachable from GitHub-hosted runners."
          echo "Commit pushed to master: $GITHUB_SHA"

  notify-success:
    runs-on: ubuntu-latest
    needs: [cd-pull-based]
    if: success()
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[VocalGuard] Push master OK"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Push détecté sur master.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [cd-pull-based]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[VocalGuard] Push master KO"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Workflow CD en échec.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
