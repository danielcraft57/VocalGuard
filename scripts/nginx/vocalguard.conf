# VocalGuard - reverse proxy node12 -> node14
# WS events (:8000) + audio sortant (:8090), HTTPS multidomain

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vocalguard_api {
    server node14.lan:8000;
    keepalive 16;
}

upstream vocalguard_telephony {
    server node14.lan:8090;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name node12.lan vocalguard.danielcraft.fr phone.danielcraft.fr repondeur.danielcraft.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name node12.lan vocalguard.danielcraft.fr phone.danielcraft.fr repondeur.danielcraft.fr;

    ssl_certificate /etc/letsencrypt/live/vocalguard-multidomain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vocalguard-multidomain/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Assets Next hashes : cache long
    location /_next/static/ {
        proxy_pass http://vocalguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /_next/ {
        proxy_pass http://vocalguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Audio appel sortant -> daemon telephony
    location /ws/outgoing-call/ {
        proxy_pass http://vocalguard_telephony;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # Events live (modale appels, refresh) -> API
    location /ws/ {
        proxy_pass http://vocalguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # HTML / API : pas de cache agressif (live UI)
    location / {
        proxy_pass http://vocalguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache";
    }
}
