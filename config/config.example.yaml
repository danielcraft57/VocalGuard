# Configuration exemple pour VocalGuard

# Base de données
database_url: "sqlite:///vocalguard.db"

# API
api_host: "0.0.0.0"
api_port: 8000
api_debug: false

# Modem
modem_port: null  # Auto-détection si null
modem_baudrate: 115200

# Voice - Reconnaissance
voice_recognition_engine: "whisper"  # whisper ou vosk
voice_language: "fr"

# Whisper
whisper_model: "base"  # tiny, base, small, medium, large
whisper_device: "cpu"  # cpu ou cuda

# VOSK (si utilisé)
vosk_model_path: null  # Chemin vers le modèle VOSK

# Voice - Synthèse
voice_synthesis_engine: "pyttsx3"  # pyttsx3, gtts ou edgetts
# Pour edgetts: choisir une voix (ex. fr-FR-DeniseNeural, fr-FR-HenriNeural)
# Liste des voix: python -m edge_tts --list-voices
edge_tts_voice: "fr-FR-DeniseNeural"
edge_tts_rate: "+12%"

# Appels
# rings=0 = coupe-sonnerie + decrochage immediat (CID en parallele / via ATA)
rings_before_answer: 0
# Fenetre CID avant seize voix au 1er RING (rings=0) : plus bas = moins de sonnerie fixe parallele.
instant_seize_cid_grace_sec: 0.35
# Sonneries laissees au fixe en mode telephone (UI topbar).
phone_mode_rings: 4
cid_wait_sec: 2.5
max_call_duration: 300  # secondes
# true = repondeur modem. false = journalise l'appel, le telephone parallele repond seul
# Bascule aussi via UI (topbar) -> PUT /api/v1/settings/incoming-line-mode
# En repondeur + rings=0 : pas d'attente CID avant ATA (prise immediate).
incoming_auto_answer: true
# Planning (optionnel) : ecrase le switch UI sur des creneaux (lundi=0 ... dimanche=6)
# incoming_line_schedule:
#   enabled: true
#   rules:
#     - days: [0, 1, 2, 3, 4]
#       start: "22:00"
#       end: "07:00"
#       mode: voicemail
whitelist_ring_only: false

# Modem voix / CID
modem_country_gci: "3D"  # France
modem_pcw_off_for_cid: true
modem_distinctive_ring: false
# Gains V.253 (null = ne pas envoyer) ; calibrer sur node14
modem_voice_vgr: null
modem_voice_vgt: null
outgoing_use_vtr: false  # reserve ; fallback talkspurt si true sans support
mic_vad_rms: 500
mic_vad_hangover_ms: 500

# Blocage (inspire de callattendant: NOMOROBO USA, SHOULDIANSWER hors USA, ou vide)
block_enabled: true
# block_service: "NOMOROBO" | "SHOULDIANSWER" | "" (desactive)
block_service: ""
# Credentials dans .env: NOMOROBO_API_KEY, SHOULDIANSWER_API_KEY

# Détection commerciale (inspiré de callattendant)
commercial_detection:
  enabled: true
  # Patterns personnalisés de numéros (optionnel)
  number_patterns: {}
  # Patterns personnalisés de noms (optionnel)
  name_patterns: {}
  # Exemple de patterns personnalisés:
  # number_patterns:
  #   "^(\+33|0)8[0-9]{2}[0-9]{6}$": "Numéro surtaxé personnalisé"
  # name_patterns:
  #   "V[0-9]{15}": "Télémarketeur (Caller ID)"

# OSINT - Services externes (optionnel)
# Définir les clés API dans le fichier .env ou variables d'environnement
# NUMLOOKUP_API_KEY=your_key
# OPENCNAM_API_KEY=your_key
# NUMVERIFY_API_KEY=your_key
# HLR_API_KEY=your_key

# Messagerie vocale
voicemail_enabled: true
voicemail_mode: simple
voicemail_greeting: >-
  Bonjour, vous êtes bien chez DanielCraft, de Loïc Daniel,
  merci de laisser un message.
voicemail_max_duration: 60  # secondes
voicemail_silence_timeout_sec: 5

# Configuration avancee appels entrants (voir aussi data/incoming_call_settings.yaml)
# Editable via API PUT /api/v1/settings/incoming-call et UI /settings
# incoming_call:
#   ring_cycle_sec: 6.0
#   ring_quiet_abort_sec: 6.0
#   screened_when_unknown: true
#   presets:
#     voicemail:
#       label: Repondeur
#       screened_actions: [answer, greeting, record]
#     phone:
#       label: Telephone
#       screened_actions: [ignore]

